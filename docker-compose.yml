name: plateforme-formations

services:
  mongodb:
    image: mongo:8.0.29-noble
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --oplogSize
      - '128'
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--host',
          'localhost',
          '--quiet',
          '--eval',
          'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mongodb-init:
    image: mongo:8.0.29-noble
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ['mongosh']
    command:
      - mongodb://mongodb:27017/admin
      - --quiet
      - /scripts/init-replica-set.js
    volumes:
      - ./Web/backend/docker/init-replica-set.js:/scripts/init-replica-set.js:ro
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: Web/backend/Dockerfile
    env_file:
      - ./Web/backend/.env
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: mongodb://mongodb:27017/plateforme_formations?replicaSet=rs0&directConnection=true
      UPLOAD_DIR: /app/uploads
      CENTER_LOGO_PATH: /app/Web/backend/assets/hsa-logo-blue.png
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  mongodb_data:
  backend_uploads:
