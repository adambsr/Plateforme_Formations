name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run formatting, linting, type checks, tests, and builds
        run: npm run check

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the application stack
        run: docker compose up --build --detach --wait

      - name: Verify health and replica-set readiness
        run: |
          curl --fail --show-error http://127.0.0.1:3000/api/health
          docker compose exec --no-TTY mongodb mongosh --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)"

      - name: Run Phase 1-7 HTTP and MongoDB integration tests
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/plateforme_formations_integration?replicaSet=rs0&directConnection=true
        run: npm run test:integration

      - name: Show Compose logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the CI stack
        if: always()
        run: docker compose down --volumes
